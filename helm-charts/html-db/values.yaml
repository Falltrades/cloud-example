# -- Image configuration for the application components
image:
  # -- The image for the web application
  web: ghcr.io/falltrades/cloud-example/html-db:1.0.0
  # -- The image for the postgres database
  db: postgres:15

# -- Port configurations for internal services
service:
  # -- The port the web container listens on
  webPort: 8080
  # -- The port the database container listens on
  dbPort: 5432

# -- Database connection and credential settings
db:
  # -- Name of the database to create
  name: "myapp"
  # -- Username for the database administrator
  user: "admin"
  # -- Password for the database
  password: "password"

# -- Ingress configuration to expose the web service
ingress:
  # -- Enable ingress record generation
  enabled: true
  # -- Ingress class name (usually 'nginx')
  className: "nginx"
  # -- Annotations for the Ingress (e.g., for cert-manager)
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  # -- Hostname for the application
  host: "html-db.example.com"
  # -- TLS configuration
  tls:
    enabled: true
    secretName: "html-db-tls"
